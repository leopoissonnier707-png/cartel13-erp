<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cartel 13 — Connexion</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#e8e8e8;min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
body::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% -20%,rgba(192,57,43,0.15) 0%,transparent 60%)}
body::after{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,transparent,transparent 40px,rgba(255,255,255,.015) 40px,rgba(255,255,255,.015) 41px),repeating-linear-gradient(90deg,transparent,transparent 40px,rgba(255,255,255,.015) 40px,rgba(255,255,255,.015) 41px);pointer-events:none}
.box{background:#111;border:1px solid #2a2a2a;padding:60px 50px;max-width:440px;width:100%;text-align:center;position:relative;z-index:1}
.box::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:60%;height:2px;background:linear-gradient(90deg,transparent,#c0392b,transparent)}
.logo{font-family:'Bebas Neue',sans-serif;font-size:80px;letter-spacing:4px;line-height:1;color:#e8e8e8}
.logo span{color:#c0392b}
.sub{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:6px;color:#555;text-transform:uppercase;margin-bottom:48px;margin-top:4px}
.desc{font-size:13px;color:#888;line-height:1.8;margin-bottom:40px;border:1px solid #1e1e1e;padding:16px;background:#0d0d0d}
.btn-discord{display:flex;align-items:center;justify-content:center;gap:14px;background:#5865F2;color:#fff;border:none;padding:18px 32px;font-family:'Oswald',sans-serif;font-size:16px;letter-spacing:2px;cursor:pointer;width:100%;transition:all .2s;text-decoration:none}
.btn-discord:hover{background:#4752c4;transform:translateY(-2px);box-shadow:0 8px 24px rgba(88,101,242,0.3)}
.btn-discord svg{width:24px;height:24px;fill:#fff;flex-shrink:0}
.error{background:rgba(192,57,43,.15);border:1px solid rgba(192,57,43,.3);color:#e74c3c;padding:12px 16px;font-size:13px;margin-bottom:20px;display:none}
.error.show{display:block}
.footer{margin-top:28px;font-size:11px;color:#333;letter-spacing:1px}
.particles{position:fixed;inset:0;pointer-events:none;z-index:0}
.p{position:absolute;width:1px;height:1px;background:#c0392b;border-radius:50%;opacity:0;animation:float linear infinite}
@keyframes float{0%{opacity:0;transform:translateY(100vh)}10%{opacity:.6}90%{opacity:.3}100%{opacity:0;transform:translateY(-10vh)}}
</style>
</head>
<body>
<div class="particles" id="particles"></div>
<div class="box">
  <div class="logo">CARTEL<span>13</span></div>
  <div class="sub">Nova Life — Plateforme ERP</div>
  <div class="error" id="err"></div>
  <div class="desc">
    Accès réservé aux membres autorisés du Cartel 13.<br/>
    Connecte-toi avec ton compte Discord pour accéder à la plateforme.
  </div>
  <a class="btn-discord" href="/auth/discord">
    <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.043.03.054a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
    Se connecter avec Discord
  </a>
  <div class="footer">Cartel 13 © 2024 — Nova Life RP</div>
</div>
<script>
// Particles
const container = document.getElementById('particles');
for(let i=0;i<20;i++){
  const p=document.createElement('div');
  p.className='p';
  p.style.cssText=`left:${Math.random()*100}%;width:${Math.random()*3+1}px;height:${Math.random()*3+1}px;animation-duration:${Math.random()*15+10}s;animation-delay:${Math.random()*10}s`;
  container.appendChild(p);
}
// Errors
const params=new URLSearchParams(location.search);
const err=document.getElementById('err');
const errors={not_authorized:'Accès refusé. Tu n\'es pas membre autorisé du Cartel 13.',banned:'Ton compte a été banni de la plateforme.',auth_failed:'Erreur d\'authentification Discord. Réessaie.',no_code:'Connexion annulée.'};
if(params.get('error')&&errors[params.get('error')]){err.textContent=errors[params.get('error')];err.classList.add('show');}
</script>
</body>
</html>
