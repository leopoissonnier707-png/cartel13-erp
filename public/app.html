<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cartel 13 — ERP</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0a;--bg2:#111;--bg3:#161616;--bg4:#1e1e1e;--red:#c0392b;--red2:#e74c3c;--gold:#c9a84c;--text:#e8e8e8;--text2:#aaa;--text3:#555;--border:#1e1e1e;--border2:#2a2a2a;--success:#27ae60;--warn:#e67e22;--info:#2980b9}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
#wp-bg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;background-attachment:fixed;opacity:0;transition:opacity .5s;pointer-events:none}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--red)}
.sidebar{width:255px;background:rgba(17,17,17,0.97);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;backdrop-filter:blur(10px)}
.s-logo{padding:22px 20px 16px;border-bottom:1px solid var(--border)}
.s-logo .name{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:3px;line-height:1}.s-logo .name span{color:var(--red)}
.s-logo .tag{font-size:9px;letter-spacing:5px;color:var(--text3);text-transform:uppercase;font-family:'Oswald',sans-serif}
.s-user{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.s-av{width:40px;height:40px;border-radius:50%;border:2px solid var(--red);overflow:hidden;flex-shrink:0}
.s-av img{width:100%;height:100%;object-fit:cover}
.s-uname{font-size:13px;font-weight:500}
.s-role{font-size:10px;letter-spacing:2px;text-transform:uppercase;font-family:'Oswald',sans-serif;color:var(--red)}
.s-nav{flex:1;padding:10px 0;overflow-y:auto}
.s-sec{padding:8px 20px 3px;font-size:9px;letter-spacing:4px;color:var(--text3);text-transform:uppercase;font-family:'Oswald',sans-serif;margin-top:6px}
.s-item{display:flex;align-items:center;gap:10px;padding:10px 20px;color:var(--text2);cursor:pointer;transition:all .15s;font-size:13px;border-left:2px solid transparent}
.s-item:hover{background:var(--bg3);color:var(--text);border-left-color:var(--border2)}
.s-item.active{background:rgba(192,57,43,.08);color:var(--red);border-left-color:var(--red)}
.s-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;padding:2px 6px;border-radius:10px;font-weight:700}
.s-foot{padding:14px 20px;border-top:1px solid var(--border)}
.s-logout{display:flex;align-items:center;gap:8px;color:var(--text3);font-size:12px;cursor:pointer;background:none;border:none;width:100%;transition:color .15s}
.s-logout:hover{color:var(--red)}
.main{margin-left:255px;display:flex;flex-direction:column;min-height:100vh;position:relative;z-index:1}
.topbar{height:56px;background:rgba(17,17,17,0.95);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:50;backdrop-filter:blur(10px)}
.tb-title{font-family:'Oswald',sans-serif;font-size:17px;letter-spacing:2px;font-weight:500}
.tb-right{font-size:12px;color:var(--text3);font-family:'Oswald',sans-serif;letter-spacing:1px}
.page{padding:26px;flex:1}
.card{background:rgba(17,17,17,0.92);border:1px solid var(--border);padding:20px;margin-bottom:16px;backdrop-filter:blur(8px)}
.card-title{font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:2px;text-transform:uppercase;margin-bottom:16px;color:var(--text2)}
.card-title span{color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat{background:rgba(17,17,17,0.92);border:1px solid var(--border);padding:16px;position:relative;overflow:hidden;backdrop-filter:blur(8px)}
.stat::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--c,var(--red))}
.stat-n{font-family:'Bebas Neue',sans-serif;font-size:44px;line-height:1}
.stat-l{font-size:9px;letter-spacing:3px;color:var(--text3);text-transform:uppercase;font-family:'Oswald',sans-serif;margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border:1px solid;font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:1px;cursor:pointer;transition:all .15s;text-transform:uppercase}
.btn-p{background:var(--red);border-color:var(--red);color:#fff}.btn-p:hover{background:var(--red2)}
.btn-o{background:transparent;border-color:var(--border2);color:var(--text2)}.btn-o:hover{border-color:var(--red);color:var(--red)}
.btn-s{background:var(--success);border-color:var(--success);color:#fff}
.btn-w{background:var(--warn);border-color:var(--warn);color:#fff}
.btn-x{background:#c0392b;border-color:#c0392b;color:#fff}
.btn-sm{padding:5px 11px;font-size:11px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:8px 12px;font-size:9px;letter-spacing:3px;color:var(--text3);text-transform:uppercase;font-family:'Oswald',sans-serif;border-bottom:1px solid var(--border);font-weight:400}
td{padding:10px 12px;font-size:12px;border-bottom:1px solid var(--border);color:var(--text2)}
tr:hover td{background:rgba(255,255,255,.02);color:var(--text)}
.badge{display:inline-block;padding:2px 8px;font-size:9px;letter-spacing:1px;text-transform:uppercase;font-family:'Oswald',sans-serif}
.b-pend{background:rgba(230,126,34,.15);color:var(--warn);border:1px solid rgba(230,126,34,.3)}
.b-acc{background:rgba(39,174,96,.15);color:var(--success);border:1px solid rgba(39,174,96,.3)}
.b-del{background:rgba(41,128,185,.15);color:#3498db;border:1px solid rgba(41,128,185,.3)}
.b-ref{background:rgba(192,57,43,.15);color:var(--red);border:1px solid rgba(192,57,43,.3)}
.b-adm{background:rgba(192,57,43,.2);color:var(--red2);border:1px solid rgba(192,57,43,.4)}
.b-sta{background:rgba(230,126,34,.2);color:var(--warn);border:1px solid rgba(230,126,34,.4)}
.b-mem{background:rgba(41,128,185,.1);color:#5dade2;border:1px solid rgba(41,128,185,.3)}
.fg{margin-bottom:13px}
.fl{display:block;font-size:9px;letter-spacing:3px;color:var(--text3);text-transform:uppercase;font-family:'Oswald',sans-serif;margin-bottom:6px}
.fi{width:100%;background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:10px 12px;font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:border-color .15s}
.fi:focus{border-color:var(--red)}
.fi::placeholder{color:var(--text3)}
select.fi{cursor:pointer}select.fi option{background:var(--bg3)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-ov.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);width:100%;max-width:500px;max-height:88vh;overflow-y:auto;position:relative}
.modal::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--red),transparent)}
.mh{padding:20px 22px 0;display:flex;align-items:center;justify-content:space-between}
.mt{font-family:'Oswald',sans-serif;font-size:15px;letter-spacing:2px;text-transform:uppercase}
.mc{background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;padding:4px;transition:color .15s;line-height:1}.mc:hover{color:var(--red)}
.mb{padding:20px 22px 24px}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:20px}
.tab{padding:10px 16px;font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:1px;cursor:pointer;color:var(--text3);border-bottom:2px solid transparent;transition:all .15s;text-transform:uppercase;margin-bottom:-1px}
.tab.active{color:var(--red);border-bottom-color:var(--red)}
.tab:hover:not(.active){color:var(--text)}
.toast-c{position:fixed;bottom:20px;right:20px;z-index:9000;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--bg2);border:1px solid var(--border2);border-left:3px solid var(--red);padding:12px 16px;font-size:12px;min-width:240px;animation:tin .3s ease}
@keyframes tin{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.toast.ok{border-left-color:var(--success)}.toast.warn{border-left-color:var(--warn)}.toast.info{border-left-color:var(--info)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:13px}
.pcard{background:rgba(17,17,17,0.92);border:1px solid var(--border);overflow:hidden;cursor:pointer;transition:all .2s;backdrop-filter:blur(8px)}
.pcard:hover{border-color:var(--red);transform:translateY(-2px)}
.pimg{height:140px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:44px;position:relative;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.pcat{position:absolute;top:7px;left:7px;background:rgba(0,0,0,.8);border:1px solid var(--border2);padding:2px 7px;font-size:9px;letter-spacing:2px;text-transform:uppercase;font-family:'Oswald',sans-serif;color:var(--text2)}
.pinfo{padding:13px}
.pname{font-family:'Oswald',sans-serif;font-size:14px;font-weight:500;letter-spacing:1px;margin-bottom:4px}
.pdesc{font-size:11px;color:var(--text3);line-height:1.5;margin-bottom:9px}
.pprice{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--gold)}
.log-e{padding:8px 12px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px;font-size:12px}
.log-t{color:var(--text3);flex-shrink:0;font-size:10px;min-width:125px}
.log-txt{color:var(--text2);flex:1;line-height:1.5}
.log-txt strong{color:var(--text)}
.empty{text-align:center;padding:46px 20px;color:var(--text3)}
.empty .ei{font-size:40px;margin-bottom:12px;opacity:.3}
.ib{background:var(--bg3);border:1px solid var(--border2);border-left:3px solid var(--info);padding:11px 14px;font-size:12px;color:var(--text2);margin-bottom:14px;line-height:1.6}
.ib.warn{border-left-color:var(--warn)}.ib.ok{border-left-color:var(--success)}
.mrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.mrow:last-child{border-bottom:none}
.mav{width:36px;height:36px;border-radius:50%;overflow:hidden;background:var(--bg4);flex-shrink:0;border:1px solid var(--border2)}
.mav img{width:100%;height:100%;object-fit:cover}
.stars{display:flex;gap:4px;font-size:22px;cursor:pointer;margin:10px 0}
.star{color:var(--text3);transition:color .1s}.star.on{color:var(--gold)}
</style>
</head>
<body>
<div id="wp-bg"></div>
<div class="toast-c" id="toasts"></div>
<div class="modal-ov" id="modal-ov" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="mh"><div class="mt" id="modal-title"></div><button class="mc" onclick="closeModal()">✕</button></div>
    <div class="mb" id="modal-body"></div>
  </div>
</div>

<aside class="sidebar">
  <div class="s-logo">
    <div class="name">CARTEL<span>13</span></div>
    <div class="tag">Nova Life ERP</div>
  </div>
  <div class="s-user">
    <div class="s-av"><img id="s-av" src="" alt=""/></div>
    <div><div class="s-uname" id="s-name">—</div><div class="s-role" id="s-role">—</div></div>
  </div>
  <nav class="s-nav" id="s-nav"></nav>
  <div class="s-foot">
    <button class="s-logout" onclick="location.href='/auth/logout'">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Déconnexion
    </button>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <div class="tb-title" id="tb-title">Chargement...</div>
    <div class="tb-right" id="tb-time"></div>
  </div>
  <div class="page" id="page"></div>
</main>

<script>
let ME = null;
let DATA = { categories:[], products:[], orders:[], members:[], logs:[], settings:{} };

// ── INIT ──────────────────────────────────────────────
async function init() {
  try {
    ME = await api('GET', '/api/me');
    document.getElementById('s-av').src = ME.avatar;
    document.getElementById('s-name').textContent = ME.username;
    const roleLabels = { admin:'Administrateur', staff:'Staff', member:'Membre' };
    document.getElementById('s-role').textContent = roleLabels[ME.role] || ME.role;
    buildNav();
    await loadAll();
    const startPage = ['admin','staff'].includes(ME.role) ? 'dashboard' : 'catalog';
    showPage(startPage);
    setInterval(() => {
      const el = document.getElementById('tb-time');
      if(el) el.textContent = new Date().toLocaleTimeString('fr-FR');
    }, 1000);
  } catch(e) { location.href = '/'; }
}

async function loadAll() {
  const [cats, prods, ords, settings] = await Promise.all([
    api('GET','/api/categories'),
    api('GET','/api/products'),
    api('GET','/api/orders'),
    api('GET','/api/settings'),
  ]);
  DATA.categories = cats || [];
  DATA.products = prods || [];
  DATA.orders = ords || [];
  DATA.settings = settings || {};
  applyWallpaper();
  if (['admin','staff'].includes(ME.role)) {
    const [members, logs] = await Promise.all([api('GET','/api/members'), api('GET','/api/logs')]);
    DATA.members = members || [];
    DATA.logs = logs || [];
  }
}

function applyWallpaper() {
  const wp = DATA.settings.wallpaper;
  const el = document.getElementById('wp-bg');
  if (wp) {
    el.style.backgroundImage = `url(${wp})`;
    el.style.opacity = DATA.settings.wallpaper_opacity || '0.18';
  } else {
    el.style.opacity = '0';
  }
}

async function api(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: body ? {'Content-Type':'application/json'} : {},
    body: body ? JSON.stringify(body) : undefined
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

// ── NAV ────────────────────────────────────────────────
function buildNav() {
  const pending = DATA.orders.filter(o=>o.status==='pending').length;
  let html = '';
  html += `<div class="s-sec">Boutique</div>`;
  html += ni('catalog','📦','Catalogue');
  html += ni('myorders','🛒','Mes commandes');
  if (['admin','staff'].includes(ME.role)) {
    html += `<div class="s-sec" style="margin-top:8px">Gestion</div>`;
    html += ni('dashboard','📊','Dashboard');
    html += ni('orders','📋','Commandes', pending||'');
    if (ME.role === 'admin') {
      html += ni('products','🏪','Produits');
      html += ni('members','👥','Membres');
      html += ni('logs','📜','Logs');
      html += ni('settings','⚙️','Paramètres');
    }
  }
  document.getElementById('s-nav').innerHTML = html;
}
function ni(page, icon, label, badge='') {
  return `<div class="s-item" id="nav-${page}" onclick="showPage('${page}')">${icon} ${label}${badge?`<span class="s-badge">${badge}</span>`:''}</div>`;
}
function setNav(p) {
  document.querySelectorAll('.s-item').forEach(e=>e.classList.remove('active'));
  const el = document.getElementById('nav-'+p);
  if(el) el.classList.add('active');
}

// ── PAGES ──────────────────────────────────────────────
const TITLES = {dashboard:'Dashboard',orders:'Commandes',catalog:'Catalogue',myorders:'Mes Commandes',products:'Produits',members:'Membres',logs:'Logs Système',settings:'Paramètres'};
async function showPage(p) {
  setNav(p);
  document.getElementById('tb-title').textContent = TITLES[p]||p;
  await loadAll();
  buildNav();
  const pages = {dashboard:pageDashboard,orders:pageOrders,catalog:pageCatalog,myorders:pageMyOrders,products:pageProducts,members:pageMembers,logs:pageLogs,settings:pageSettings};
  document.getElementById('page').innerHTML = (pages[p]||pageDashboard)();
}

// ── DASHBOARD ─────────────────────────────────────────
function pageDashboard() {
  const o = DATA.orders;
  return `
  <div class="stats">
    <div class="stat" style="--c:var(--red)"><div class="stat-n">${o.length}</div><div class="stat-l">Commandes</div></div>
    <div class="stat" style="--c:var(--warn)"><div class="stat-n">${o.filter(x=>x.status==='pending').length}</div><div class="stat-l">En attente</div></div>
    <div class="stat" style="--c:var(--success)"><div class="stat-n">${o.filter(x=>x.status==='delivered').length}</div><div class="stat-l">Livrées</div></div>
    <div class="stat" style="--c:var(--info)"><div class="stat-n">${DATA.members.length}</div><div class="stat-l">Membres</div></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
    <div class="card">
      <div class="card-title">Dernières <span>commandes</span></div>
      <div class="tw"><table>
        <thead><tr><th>ID</th><th>Client</th><th>Produit</th><th>Statut</th></tr></thead>
        <tbody>${o.slice(0,5).map(o=>`<tr>
          <td style="color:var(--red);font-family:'Oswald',sans-serif">${o.order_id}</td>
          <td>${o.rp_name||o.username}</td>
          <td>${o.product_name}</td>
          <td>${bs(o.status)}</td>
        </tr>`).join('')||'<tr><td colspan="4" style="text-align:center;color:var(--text3);padding:20px">Aucune commande</td></tr>'}
        </tbody>
      </table></div>
    </div>
    <div class="card">
      <div class="card-title">Derniers <span>logs</span></div>
      ${DATA.logs.slice(0,6).map(l=>`<div class="log-e">
        <div class="log-t">${new Date(l.created_at).toLocaleTimeString('fr-FR')}</div>
        <div class="log-txt"><strong>${l.user_name}</strong> — ${l.action}</div>
      </div>`).join('')||'<div class="empty" style="padding:20px"><p>Aucun log</p></div>'}
    </div>
  </div>`;
}

// ── CATALOG ────────────────────────────────────────────
function pageCatalog() {
  return `
  <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
    <button class="btn btn-o btn-sm" onclick="filterCat(0)">🏪 Tous</button>
    ${DATA.categories.map(c=>`<button class="btn btn-o btn-sm" onclick="filterCat(${c.id})">${c.icon} ${c.name}</button>`).join('')}
  </div>
  <div class="pgrid" id="pgrid">${renderProds(DATA.products.filter(p=>p.available))}</div>`;
}
function renderProds(prods) {
  if(!prods.length) return `<div class="empty"><div class="ei">📦</div><p>Aucun produit disponible</p></div>`;
  return prods.map(p=>{
    const cat = DATA.categories.find(c=>c.id===p.category_id);
    return `<div class="pcard">
      <div class="pimg">
        ${p.image_url?`<img src="${p.image_url}" alt="${p.name}"/>`:''}
        <span style="position:relative;z-index:1;font-size:38px;opacity:.35">${cat?cat.icon:'📦'}</span>
        ${cat?`<span class="pcat">${cat.name}</span>`:''}
      </div>
      <div class="pinfo">
        <div class="pname">${p.name}</div>
        <div class="pdesc">${p.description||''}</div>
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div class="pprice">${Number(p.price).toLocaleString('fr-FR')} $<span style="font-size:10px;margin-left:3px">${p.currency==='dirty'?'💰':'💵'}</span></div>
          <button class="btn btn-p btn-sm" onclick="openOrder(${p.id})">Commander</button>
        </div>
      </div>
    </div>`;
  }).join('');
}
function filterCat(catId) {
  const prods = catId===0 ? DATA.products.filter(p=>p.available) : DATA.products.filter(p=>p.category_id===catId&&p.available);
  document.getElementById('pgrid').innerHTML = renderProds(prods);
}

function openOrder(pid) {
  const p = DATA.products.find(x=>x.id===pid);
  if(!p) return;
  openModal('Commander — '+p.name, `
    <div class="ib">Remplissez vos infos RP. Vous recevrez un MP Discord de confirmation.</div>
    <div class="fg"><label class="fl">Prénom RP</label><input class="fi" id="o-rp" placeholder="Ton prénom en jeu"/></div>
    <div class="fr">
      <div class="fg"><label class="fl">Téléphone RP</label><input class="fi" id="o-phone" placeholder="06 12 34 56 78"/></div>
      <div class="fg"><label class="fl">Quantité</label><input class="fi" type="number" id="o-qty" value="1" min="1" oninput="updTotal(${p.price})"/></div>
    </div>
    <div class="fg"><label class="fl">Organisation RP</label><input class="fi" id="o-group" placeholder="Ex: Cartel 13..."/></div>
    <div class="fg"><label class="fl">Note (optionnel)</label><textarea class="fi" id="o-note" rows="2"></textarea></div>
    <div style="background:var(--bg3);border:1px solid var(--border2);padding:13px;margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px"><span style="color:var(--text2)">Produit</span><span>${p.name}</span></div>

function setStar(n) {
  window._starRating = n;
  const labels = ['','Très mauvais','Mauvais','Moyen','Bien','Excellent !'];
  document.getElementById('star-label').textContent = labels[n] + ` (${n}/5)`;
  document.querySelectorAll('.star').forEach((s,i)=>{
    s.textContent = i<n ? '⭐' : '☆';
    s.classList.toggle('on', i<n);
  });
}
function hoverStar(n) {
  document.querySelectorAll('.star').forEach((s,i)=>s.textContent = i<n?'⭐':'☆');

function resetStars() {
  const n = window._starRating || 0;

function bs(s){
  const m={pending:'b-pend',accepted:'b-acc',delivered:'b-del',refused:'b-ref'};
  const l={pending:'En attente',accepted:'Acceptée',delivered:'Livrée',refused:'Refusée'};
  return `<span class="badge ${m[s]||''}">${l[s]||s}</span>`;
}
function toast(msg,type=''){
  const t=document.createElement('div');
  t.className='toast '+(type==='ok'?'ok':type==='warn'?'warn':type==='info'?'info':'');
  t.textContent=msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>t.remove(),3500);
}
function openModal(title,body){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=body;
  document.getElementById('modal-ov').classList.add('open');
}
function closeModal(){document.getElementById('modal-ov').classList.remove('open');}

init();
</script>
